[project]
name = "my-packaged-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "openai>=1.2.0",
    "python-dotenv>=1.0.0",
    "openai-agents>=0.2.2",
]

[project.scripts]
my-packaged-app = "my_packaged_app:main"
my-packaged-app-main = "my_packaged_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]



[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.19.0",
    "ruff>=0.14.8",
]
